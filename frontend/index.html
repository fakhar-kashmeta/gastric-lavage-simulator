<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashmeta Gastric Lavage Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
    body { margin: 0; overflow: hidden; background-color: #0f172a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    #root { height: 100vh; width: 100vw; }
    
    /* Custom animations */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.5)); }
      50% { filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.9)); }
    }
    .animate-pulse-glow { animation: pulse-glow 2s infinite; }
    
    @keyframes float-up {
      0% { opacity: 0; transform: translateY(20px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(-20px); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    .animate-float-up { animation: float-up 2s ease-out forwards; }

    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    .path-animate {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 2s ease-in-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
